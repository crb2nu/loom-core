# =============================================================================
# DEPLOY STAGE
# =============================================================================

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'loom-linux-amd64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-linux-amd64?job=build:linux-amd64'
        - name: 'loom-linux-arm64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-linux-arm64?job=build:linux-arm64'
        - name: 'loom-darwin-amd64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-darwin-amd64?job=build:darwin-amd64'
        - name: 'loom-darwin-arm64'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/loom-darwin-arm64?job=build:darwin-arm64'
  rules:
    - if: $CI_COMMIT_TAG

deploy:homebrew:
  stage: deploy
  image: ${PUBLIC_IMAGE_REGISTRY}/library/alpine:3.24
  # No before_script: this job is a placeholder that echoes. The `apk add git
  # curl` it used to run reached dl-cdn.alpinelinux.org (no in-cluster mirror)
  # to install tools nothing here calls. Reinstate it — behind a mirror — when
  # the tap update is actually implemented.
  script:
    - echo "Homebrew tap update would go here"
    - echo "Update formula with new version $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
  when: manual

ios:archive-export:
  stage: deploy
  tags:
    - macos
  needs: []
  # This job runs repo-local signing/export scripts, so it must opt out of the
  # global no-checkout mode and fetch a working tree first.
  variables:
    GIT_STRATEGY: fetch
  script:
    - chmod +x scripts/mobile/import-certificate.sh scripts/mobile/archive_export.sh scripts/mobile/cleanup-signing.sh
    - ./scripts/mobile/import-certificate.sh
    - set -a && source build.env && set +a
    - ./scripts/mobile/archive_export.sh
  after_script:
    - ./scripts/mobile/cleanup-signing.sh || true
  artifacts:
    when: always
    paths:
      - build/mobile/LoomCompanion.xcarchive
      - build/mobile/export/app-store/*.ipa
      - build/mobile/ExportOptions.app-store.plist
    expire_in: 1 week
  # allow_failure keeps this manual job non-blocking: an un-triggered iOS
  # archive must not leave every main pipeline stuck in "blocked/manual".
  # The server image builds (below) run on_success regardless, but a blocking
  # manual job prevents the pipeline from ever reaching "success", which
  # confuses operators and any pipeline-success automation. The job stays
  # manually triggerable for actual App Store builds.
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: never

build:image:loom-core:
  stage: deploy
  # DAG: start as soon as the image's real gates are done instead of waiting
  # for the whole test stage. Deliberately NOT listed: test:race, test:benchmark
  # (main-only monitors that keep running in parallel and still fail the
  # pipeline) and build:binaries (its per-SHA bin cache feeds test:integration,
  # not the image). On a validated-tree merge the listed jobs skip in seconds,
  # so the image lands ~10 min after the merge instead of ~40 (2026-09-11:
  # 12:18 merge → 12:56 image start on pipeline 26296). `optional` because
  # several of these are main-only or rule-gated on branch pipelines.
  needs:
    - {job: 'build:frontend', optional: true, artifacts: false}
    - {job: 'fmt', optional: true, artifacts: false}
    - {job: 'guardrails:docs-cli', optional: true, artifacts: false}
    - {job: 'lint', optional: true, artifacts: false}
    - {job: 'lint:ci-guards', optional: true, artifacts: false}
    - {job: 'lint:mcp-godot', optional: true, artifacts: false}
    - {job: 'lint:rbac-policy', optional: true, artifacts: false}
    - {job: 'security:gosec', optional: true, artifacts: false}
    - {job: 'security:govulncheck', optional: true, artifacts: false}
    - {job: 'vet', optional: true, artifacts: false}
    - {job: 'test:enterprise-smoke', optional: true, artifacts: false}
    - {job: 'test:hooks', optional: true, artifacts: false}
    - {job: 'test:integration', optional: true, artifacts: false}
    - {job: 'test:reliability', optional: true, artifacts: false}
    - {job: 'test:unit', optional: true, artifacts: false}
  interruptible: true
  timeout: 90 minutes
  # Image jobs do not use language caches; skip restore/upload overhead.
  cache: []
  # Keep serialization within a ref, but don't let feature/MR pipelines block main.
  resource_group: "buildkit-images-loom-core-${CI_COMMIT_REF_SLUG}"
  retry:
    # Keep max at 1: a 90-minute image build is expensive to re-run twice.
    max: 1
    when: *ci-infra-failure-reasons
  image:
    name: $BUILDKIT_CLI_IMAGE
    entrypoint: [""]
  # GIT_STRATEGY overrides the global "none" because image jobs need a working tree.
  # DOCKER_HOST="" prevents the runner from waiting for a DinD daemon.
  variables:
    GIT_STRATEGY: fetch
    DOCKER_HOST: ""
  script:
    - chmod +x scripts/ci/buildkit-build.sh
    # FRONTEND_TREE pins the Dockerfile's frontend stage to the exact git
    # content of internal/hud/frontend. BuildKit's context checksum falsely
    # CACHED the frontend COPY+build on 2026-07-27 (pipeline 21165 → image
    # 20260727-161926), deploying a stale HUD bundle that was missing 9 merged
    # frontend commits. Fall back to the commit SHA (always-rebuild) if the
    # buildkit CLI image has no git — correctness beats cache reuse here.
    - FRONTEND_TREE=$(git rev-parse "HEAD:internal/hud/frontend" 2>/dev/null || echo "$CI_COMMIT_SHA")
    - echo "FRONTEND_TREE=${FRONTEND_TREE}"
    - scripts/ci/buildkit-build.sh mcp/loom-core Dockerfile loom-core --opt "build-arg:FRONTEND_TREE=${FRONTEND_TREE}"
  rules:
    - if: '$CI_COMMIT_TAG'
    # Default branch: only (re)build + publish the Flux-deployable
    # `:YYYYMMDD-HHMMSS` tag when the image's real inputs change. Without this
    # gate every main merge (docs, Mills, CI config, unrelated services) minted
    # a fresh timestamp tag, which Flux Image Automation deployed — rolling the
    # whole shared-image loom-hub fleet on every publish (loom-core backs
    # mobile-hud; custom-server backs ~45 MCP servers). Mirrors the
    # feature-branch `changes:` list below so main and MR builds gate on the
    # same inputs. Investigation: loom-hub image-churn, 2026-07-04.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .dockerignore
        - Dockerfile
        - scripts/ci/buildkit-build.sh
        - go.mod
        - go.sum
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .dockerignore
        - Dockerfile
        - scripts/ci/buildkit-build.sh
        - go.mod
        - go.sum
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
      allow_failure: true
    - when: never

