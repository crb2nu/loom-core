# Loom Mills operator image — the always-on cluster control plane (council
# scheduler + pipeline reconciler). Built from Dockerfile.loom-mills-operator
# which produces a distroless single-binary image. The platform/gitops
# k3s/mills deployment pins this image by short-sha; main-branch builds
# also tag :latest for flux force-reconcile in dev environments.
build:image:loom-mills-operator:
  stage: deploy
  # DAG: start as soon as the image's real gates are done instead of waiting
  # for the whole test stage. Deliberately NOT listed: test:race, test:benchmark
  # (main-only monitors that keep running in parallel and still fail the
  # pipeline) and build:binaries (its per-SHA bin cache feeds test:integration,
  # not the image). On a validated-tree merge the listed jobs skip in seconds,
  # so the image lands ~10 min after the merge instead of ~40 (2026-09-11:
  # 12:18 merge → 12:56 image start on pipeline 26296). `optional` because
  # several of these are main-only or rule-gated on branch pipelines.
  needs:
    - {job: 'build:frontend', optional: true, artifacts: false}
    - {job: 'fmt', optional: true, artifacts: false}
    - {job: 'guardrails:docs-cli', optional: true, artifacts: false}
    - {job: 'lint', optional: true, artifacts: false}
    - {job: 'lint:ci-guards', optional: true, artifacts: false}
    - {job: 'lint:mcp-godot', optional: true, artifacts: false}
    - {job: 'lint:rbac-policy', optional: true, artifacts: false}
    - {job: 'security:gosec', optional: true, artifacts: false}
    - {job: 'security:govulncheck', optional: true, artifacts: false}
    - {job: 'vet', optional: true, artifacts: false}
    - {job: 'test:enterprise-smoke', optional: true, artifacts: false}
    - {job: 'test:hooks', optional: true, artifacts: false}
    - {job: 'test:integration', optional: true, artifacts: false}
    - {job: 'test:reliability', optional: true, artifacts: false}
    - {job: 'test:unit', optional: true, artifacts: false}
  interruptible: true
  timeout: 90 minutes
  cache: []
  resource_group: "buildkit-images-loom-mills-operator-${CI_COMMIT_REF_SLUG}"
  retry:
    # Keep max at 1: a 90-minute image build is expensive to re-run twice.
    max: 1
    when: *ci-infra-failure-reasons
  image:
    name: $BUILDKIT_CLI_IMAGE
    entrypoint: [""]
  variables:
    GIT_STRATEGY: fetch
    DOCKER_HOST: ""
  script:
    - chmod +x scripts/ci/buildkit-build.sh
    - scripts/ci/buildkit-build.sh mcp/loom-mills-operator Dockerfile.loom-mills-operator loom-mills-operator
  rules:
    - if: '$CI_COMMIT_TAG'
    # Default branch: gate on the image's real inputs, like the two image jobs
    # above. This was the last image job that rebuilt and re-tagged on EVERY
    # main merge — a 4-CPU BuildKit slot per merge, plus a Flux Image
    # Automation roll of the operator deployment on unrelated changes
    # (2026-09-04 CI-demand audit).
    #
    # The list is the operator binary's import footprint (`go list -deps
    # ./cmd/loom-mills-operator`): only cmd/loom-mills-operator, the internal/
    # packages it actually links, and pkg/**. The runtime image is a single
    # static binary, so files outside that footprint cannot change it even
    # though the builder stage does `COPY . .`. The broad cmd/internal/pkg list
    # used until 2026-09-11 rolled the operator (Recreate strategy, ~90s of
    # downtime) on every mcp-* server, HUD spawn, or killtest change. The list
    # cannot go stale silently: scripts/ci/check_operator_image_changes.sh
    # (run in `vet`) fails when a new dependency directory is not covered.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .dockerignore
        - Dockerfile.loom-mills-operator
        - scripts/ci/buildkit-build.sh
        - go.mod
        - go.sum
        - cmd/loom-mills-operator/**/*
        - internal/cache/**/*
        - internal/contracts/**/*
        - internal/fleetgate/**/*
        - internal/hud/bridge/**/*
        - internal/hud/coordination/**/*
        - internal/hud/fleetview/**/*
        - internal/hud/monitor/**/*
        - internal/hud/notify/**/*
        - internal/loomconcurrency/**/*
        - internal/visibility/**/*
        - pkg/**/*
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .dockerignore
        - Dockerfile.loom-mills-operator
        - scripts/ci/buildkit-build.sh
        - go.mod
        - go.sum
        - cmd/loom-mills-operator/**/*
        - internal/cache/**/*
        - internal/contracts/**/*
        - internal/fleetgate/**/*
        - internal/hud/bridge/**/*
        - internal/hud/coordination/**/*
