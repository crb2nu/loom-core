apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: agent-context
    component: mcp-server
    mcp.server/name: agent_context
    mcp.server/type: custom
  name: agent-context
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-context
  template:
    metadata:
      annotations:
        mcp.server/categories: dev,context,memory
        mcp.server/description: Agent context management - sessions, retrieval, cross-agent coordination
      labels:
        app: agent-context
        component: mcp-server
        mcp.server/name: agent_context
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            # Qdrant configuration (Harvester VM)
            - name: AGENT_CONTEXT_QDRANT_URL
              value: http://192.168.50.176:6333
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: QDRANT_API_KEY
                  name: loom-secrets
            - name: AGENT_CONTEXT_COLLECTION
              value: agent_context_v1
            - name: AGENT_CONTEXT_SESSIONS_COLLECTION
              value: agent_sessions_v1
            # Embeddings: intentionally unset. The MORPH_* trio that used to sit
            # here pointed at the retired Morph endpoint and sat ahead of the
            # FlexInfer defaults in pkg/agentcontext/config.go's env chain, so
            # every embed asked flexinfer-proxy for "morph-embedding-v3" (404)
            # and fell back to keyword search (2026-09-05: ~5,000 failures in
            # 6h). With nothing set the chain lands on
            # pkg/flexinfer.DefaultEmbedBaseURL + DefaultEmbedModel
            # (flexinfer-proxy, embeddings-1536, dim 1536).
            # Auto-summarization settings
            - name: AGENT_CONTEXT_AUTO_SUMMARIZE
              value: "true"
            - name: AGENT_CONTEXT_DEFAULT_TOKEN_BUDGET
              value: "4000"
            # Recall reranker (2026-09-13, flexinfer utilization slice 2). Was
            # "off" in every manifest while the bge-reranker-radeonvii lane sat
            # Ready on the retrieval card; the proxy's /v1/rerank answered a
            # 3-document probe in 0.96 s. Kind "bge" pins bge-reranker-v2-m3 by
            # default, which is not a proxy alias — the lane's aliases are
            # rerank / bge-reranker / rerank-radeonvii — so the model is set
            # explicitly. Base URL must be the keyless flexinfer proxy: with
            # nothing set the client falls back to FLEXINFER_URL (unset here)
            # and then http://localhost:8080. Rollback = WEAVER_RERANKER=off.
            - name: WEAVER_RERANKER
              value: "bge"
            - name: WEAVER_RERANKER_MODEL
              value: "bge-reranker"
            - name: WEAVER_RERANKER_BASE_URL
              value: "http://flexinfer-proxy.flexinfer-system.svc.cluster.local"
            - name: WEAVER_RERANKER_TIMEOUT
              value: "8s"
            # Logging
            - name: LOG_LEVEL
              value: info
            # MCP transport settings
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: MCP_SERVER_NAME
              value: agent_context
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-agent-context
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: agent-context
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              # Match the incident stopgap in GitOps until shared-child mode is
              # proven safe for agent-context's per-client initialize state.
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
