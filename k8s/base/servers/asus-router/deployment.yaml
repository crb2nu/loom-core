apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: asus-router
    component: mcp-server
    mcp.server/name: asus_router
    mcp.server/type: custom
  name: asus-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asus-router
  template:
    metadata:
      annotations:
        mcp.server/categories: network,router
        mcp.server/description: Manage ASUS router via SSH alias (asus-router in ~/.ssh/config)
      labels:
        app: asus-router
        component: mcp-server
        mcp.server/name: asus_router
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - env:
            # In-cluster there is no ~/.ssh/config, so the workstation alias
            # `asus-router` does not resolve; address the router directly.
            - name: ASUS_ROUTER_HOST
              value: 192.168.50.1
            - name: ASUS_ROUTER_PORT
              value: "2222"
            - name: ASUS_ROUTER_USER
              value: admin
            # Identity for the router's admin user, mounted from the optional
            # `asus-router-ssh` Secret (key `id_ed25519`, SOPS-managed in
            # platform/gitops). Until that Secret exists the mount is empty
            # and every tool fails with a clear "No such identity" instead of
            # the pre-2026-09-02 `exec: "ssh": executable file not found`.
            - name: ASUS_ROUTER_SSH_KEY
              value: /etc/asus-router/id_ed25519
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: asus_router
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-asus-router
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: asus-router
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: ssh-key
              mountPath: /etc/asus-router
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: asus-router-ssh
            # ssh refuses group/world-readable identities; 0400 for uid 1000.
            defaultMode: 0400
            optional: true
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
