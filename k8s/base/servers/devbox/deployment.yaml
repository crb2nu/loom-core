apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: devbox
    component: mcp-server
    mcp.server/name: devbox
    mcp.server/type: custom
  name: devbox
spec:
  replicas: 1
  # The state volume below is RWO Longhorn (node-scoped attach). The gitops
  # loom-hub-servers overlay patches every mcp-server Deployment to
  # RollingUpdate maxSurge:1/maxUnavailable:0 (so a base `Recreate` here is
  # overridden — observed live 2026-09-02), which means the surge pod MUST
  # co-schedule beside the incumbent to share the node attachment; see the
  # required self-affinity under `affinity:` (same pattern as mobile-hud's
  # workspace volume). The outgoing manager's SIGTERM path stops its
  # sandboxes and marks them "stopped" in the persisted store; the incoming
  # one restarts them from the registry image without a rebuild.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devbox
  template:
    metadata:
      annotations:
        mcp.server/categories: sandbox,dev,docker,kubernetes
        mcp.server/description: Project-aware dev sandbox executor. Builds isolated containers with auto-detected runtimes and deps. Execute builds, tests, lints without host dependencies. Supports file read/write, async exec, metrics, and devcontainer.json.
      labels:
        app: devbox
        component: mcp-server
        mcp.server/name: devbox
    spec:
      terminationGracePeriodSeconds: 1860
      serviceAccountName: mcp-devbox
      # Same-node self-affinity: REQUIRED by the RollingUpdate strategy — the
      # RWO `devbox-state` volume only attaches to one node, so the surge pod
      # must land beside the incumbent to share the mount. When no devbox pod
      # exists (bootstrap, node loss) the self-match carve-out lets the
      # scheduler place it anywhere. If a roll wedges Pending, check the
      # incumbent node's free capacity first (surge briefly doubles requests).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: devbox
              topologyKey: kubernetes.io/hostname
      containers:
        - env:
            - name: DEVBOX_BACKEND
              value: k8s
            - name: DEVBOX_BUILDER_IMAGE
              value: quay.io/buildah/stable:v1.38.0
            - name: DEVBOX_CACHE_DIR
              value: /home/mcp/.cache/loom/devbox
            - name: DEVBOX_DEFAULT_CPU
              value: "2"
            # 6Gi (was 4Gi, 2026-09-12): `go test ./pkg/mills ./pkg/mills/store`
            # in the shared loom-core sandbox was killed at the 4Gi limit (exit
            # 137 / "could not start the exec process (container memory limit
            # 4Gi)") in ~12 tests attempts over 2026-08-29..09-12 and escalated
            # as code failures. Limit only — requests stay at the backend's
            # 128Mi floor, so scheduling is unchanged.
            - name: DEVBOX_DEFAULT_MEMORY_MB
              value: "6144"
            - name: DEVBOX_HUD_ADDR
              valueFrom:
                secretKeyRef:
                  key: DEVBOX_HUD_ADDR
                  name: loom-secrets
            - name: DEVBOX_IDLE_TIMEOUT
              value: 30m
            - name: DEVBOX_NFS_FLUSH
              value: "false"
            - name: DEVBOX_SYNC_MODE
              value: git-clone
            - name: DEVBOX_WARM_PROJECTS
              value: ""
            - name: DEVBOX_K8S_IMAGE_PULL_SECRET
              value: harbor-creds
            - name: DEVBOX_K8S_NAMESPACE
              value: devbox
            - name: DEVBOX_K8S_STORAGE_CLASS
              value: longhorn
            - name: DEVBOX_K8S_WORKSPACE_PVC
              value: devbox-workspace-nfs
            - name: DEVBOX_K8S_MAX_CONCURRENT_BUILDS
              value: "1"
            # Shared Go build/module/lint cache for every K8s sandbox
            # (2026-09-13): the caches lived on each pod's ephemeral disk, so
            # every replaced pod recompiled the world and the 900s test check
            # timed out. The claim is defined in gitops k3s/devbox/
            # sandbox-go-cache-pvc.yaml (namespace devbox, Longhorn RWX); the
            # devbox server verifies it exists at start and falls back to cold
            # caches with a WARN when it does not.
            - name: DEVBOX_K8S_GO_CACHE_PVC
              value: devbox-sandbox-go-cache
            # Gate budgets sized to a 2-CPU sandbox with a warm cache: the test
            # commands get 20 minutes; fmt/lint keep the 5-minute default.
            - name: DEVBOX_QUALITY_GATE_TEST_TIMEOUT_SEC
              value: "1200"
            # Build CPU 2 (was 500m, 2026-09-13): buildah image builds for the
            # loom-core and fi-fhir sandboxes stalled for tens of minutes on
            # half a core while the factory waited on them (the fi-fhir build
            # sat behind the weekly base-image job that exceeded its 30-minute
            # deadline the same morning). The devbox LimitRange allows 4 CPU
            # per container and the namespace quota has 24 CPU of limits free.
            - name: DEVBOX_K8S_BUILD_CPU_REQUEST
              value: 500m
            - name: DEVBOX_K8S_BUILD_CPU_LIMIT
              value: "2"
            - name: DEVBOX_K8S_BUILD_EPHEMERAL_STORAGE_REQUEST
              value: 2Gi
            - name: DEVBOX_K8S_BUILD_EPHEMERAL_STORAGE_LIMIT
              value: 40Gi
            - name: DEVBOX_K8S_BUILD_AVOID_NODES
              value: k3s-w-7,k3s-w-11
            - name: DEVBOX_K8S_GIT_BASE_URL
              # Group-neutral root; sandbox pods derive the group-qualified
              # repo path (services/…, libs/…) from their /workspace layout,
              # and joinRepoURL dedups the boundary segment so either base
              # form stays correct during config/image rollout skew.
              value: http://192.168.50.218
            - name: DEVBOX_K8S_GIT_SECRET
              value: gitlab-creds
            - name: DEVBOX_MAX_TAIL_LINES
              value: "20"
            - name: DEVBOX_REGISTRY
              value: registry.harbor.lan
            - name: DEVBOX_WORKSPACE_ROOT
              value: /app
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: devbox
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-devbox
            # Preserve the in-process build tracker and token cache across
            # operator WebSocket reconnects.
            - name: MCP_SHARED_CHILD
              value: "1"
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: devbox
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            # DEVBOX_CACHE_DIR: state.json (which sandbox images are built /
            # which sandboxes are running) must outlive the pod, or every
            # rollout rebuilds every project image. See pvc.yaml.
            - name: state
              mountPath: /home/mcp/.cache/loom/devbox
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: devbox-state
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
