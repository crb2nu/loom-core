apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: linkedin
    component: mcp-server
    mcp.server/name: linkedin
    mcp.server/type: custom
  name: linkedin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedin
  template:
    metadata:
      annotations:
        mcp.server/categories: social,messaging,linkedin
        mcp.server/description: LinkedIn personal account management. Profile lookup and messaging operations.
      labels:
        app: linkedin
        component: mcp-server
        mcp.server/name: linkedin
    spec:
      containers:
        - env:
            # BrowserKit is deliberately disabled in-cluster: the custom-server
            # image ships no python/chromium, so session health probes and
            # recovery cannot run in this pod (the old `auto` mode surfaced as
            # NotConfigured errors on messaging tools once the cookie went
            # stale). The pod does cookie-only Voyager HTTP. Cookie refresh runs
            # on a workstation via linkedin_session_recover, then syncs into
            # gitops loom-secrets — see docs/LINKEDIN_SESSION_RECOVERY_RUNBOOK.md.
            # LINKEDIN_ACCESS_TOKEN is intentionally absent: when set it is sent
            # as an Authorization Bearer header on every Voyager call, and the
            # stored value was a stale li_at copy, not an official API token.
            - name: LINKEDIN_BROWSERKIT_MODE
              value: "off"
            # Companion device cookies (bcookie/bscookie/lidc/...) harvested at
            # login. A li_at without them is treated as stolen by LinkedIn's
            # fraud checks and the session gets revoked on first use. Optional
            # so the pod still starts before the key exists.
            - name: LINKEDIN_COOKIE_BUNDLE
              valueFrom:
                secretKeyRef:
                  key: LINKEDIN_COOKIE_BUNDLE
                  name: loom-secrets
                  optional: true
            - name: LINKEDIN_JSESSIONID
              valueFrom:
                secretKeyRef:
                  key: LINKEDIN_JSESSIONID
                  name: loom-secrets
            - name: LINKEDIN_SESSION_COOKIE
              valueFrom:
                secretKeyRef:
                  key: LINKEDIN_SESSION_COOKIE
                  name: loom-secrets
            - name: MCP_WS_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
            - name: MCP_SERVER_NAME
              value: linkedin
            - name: MCP_TRANSPORT
              value: websocket
            - name: MCP_SERVER_COMMAND
              value: /app/services/loom-core/bin/mcp-linkedin
          image: registry.harbor.lan/mcp/custom-server:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          name: linkedin
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
