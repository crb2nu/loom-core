name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  # go.work describes the developer's sibling checkouts, not this runner layout.
  GOWORK: "off"
  # Match GitLab's portable Go lane; fi-accel native libraries are not built here.
  CGO_ENABLED: "0"
  # Keep the security-patched toolchain aligned with .gitlab-ci.yml.
  GO_VERSION: "1.26.6"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Public mirror commits corresponding to the versions required by go.mod.
      # Repoint the modules to these checkouts without loading local go.work paths.
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/mcp-go
          path: _deps/mcp-go
          ref: 3af51e6cdf8c26d1fbf90fb0b859c33d9ec9627d
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/fi-mcp-kit
          path: _deps/fi-mcp-kit
          ref: f42344ef2b596261786bc801f4437894df823f80
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/fi-accel
          path: _deps/fi-accel
          ref: 7a20206d342597488207c7e282c3607351d8c006
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Wire local module replacements
        run: |
          set -euo pipefail
          go mod edit -replace gitlab.flexinfer.ai/libs/mcp-go=./_deps/mcp-go
          go mod edit -replace gitlab.flexinfer.ai/libs/fi-mcp-kit=./_deps/fi-mcp-kit
          go mod edit -replace gitlab.flexinfer.ai/libs/fi-accel/go/fiaccel=./_deps/fi-accel/go/fiaccel
      - name: Guardrails (docs drift + CLI help smoke)
        run: |
          bash scripts/ci/check_docs_guardrails.sh
          bash scripts/ci/check_flexinfer_site_integration.sh
          go run ./cmd/loom --help >/dev/null
          go run ./cmd/loom proxy --help >/dev/null
      - name: Test
        run: go test ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/mcp-go
          path: _deps/mcp-go
          ref: 3af51e6cdf8c26d1fbf90fb0b859c33d9ec9627d
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/fi-mcp-kit
          path: _deps/fi-mcp-kit
          ref: f42344ef2b596261786bc801f4437894df823f80
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: crb2nu/fi-accel
          path: _deps/fi-accel
          ref: 7a20206d342597488207c7e282c3607351d8c006
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Wire local module replacements
        run: |
          set -euo pipefail
          go mod edit -replace gitlab.flexinfer.ai/libs/mcp-go=./_deps/mcp-go
          go mod edit -replace gitlab.flexinfer.ai/libs/fi-mcp-kit=./_deps/fi-mcp-kit
          go mod edit -replace gitlab.flexinfer.ai/libs/fi-accel/go/fiaccel=./_deps/fi-accel/go/fiaccel
      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      # Match the application scope and documented rule policy in GitLab's
      # security:gosec job; do not scan the downloaded dependency checkouts.
      - name: Static security checks
        run: >-
          gosec -concurrency=2
          -exclude=G101,G104,G106,G115,G117,G118,G120,G122,G204,G301,G302,G304,G306,G401,G402,G501,G505,G702,G703,G704,G705
          -exclude-dir=_deps -exclude-dir=vendor
          -fmt json -out gosec-report.json ./cmd/... ./internal/... ./pkg/...
      # GitLab also gates on imported packages. Whole-repo symbol analysis
      # exceeds hosted-runner memory; package mode is the stricter check.
      - name: Dependency vulnerability checks
        if: success() || failure()
        run: |
          bash scripts/ci/check_go_vulnerabilities.sh
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            gosec-report.json
            govulncheck-report.txt
            govulncheck-report.raw.json
            govulncheck-report.filtered.json
